[project]
name = "tripmate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "arpit016", email = "agarwalarpit22@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ag-ui-protocol>=1.0.0",
    "airportsdata>=20260905",
    "certifi>=2026.7.22",
    "fastapi>=0.142.2",
    "fastmcp>=4.0.10",
    "hindsight-client>=0.10.2",
    "jinja2>=3.1.6",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-tavily>=0.2.18",
    "langchain-xai>=1.3.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "nest-asyncio>=1.6.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pycountry>=26.2.16",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tavily-python>=0.8.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
tripmate = "tripmate:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
